name: Consistentiecontrole

# Draait bij elke push en pull request, ook na elke wijziging in het CMS.
# Bouwt de site precies zoals Cloudflare dat doet (tools/bouw-site.py): de
# pagina's uit data/berichten.json en data/team.json, het contactformulier op
# elke pagina, en daarna de consistentiecontrole op het resultaat. Faalt het
# hier, dan faalt het ook op Cloudflare, en blijft daar de vorige versie staan.
#
# Vroeger controleerde dit ook of de gemaakte pagina's in de repo gelijk liepen
# met de gegevens. Dat kan niet meer: het CMS wijzigt alleen de gegevens, en de
# pagina's worden pas bij het bouwen gemaakt.

on: [push, pull_request]

jobs:
  consistentie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/bouw-site.py
